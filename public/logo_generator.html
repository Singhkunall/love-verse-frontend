<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1024px;
      height: 1024px;
      background: #0d0206;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }
    
    .icon-container {
      width: 960px;
      height: 960px;
      background: radial-gradient(circle at 35% 25%, #4d0a22 0%, #240410 65%, #0d0106 100%);
      border-radius: 220px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 
        0 40px 100px rgba(0,0,0,0.8),
        inset 0 2px 10px rgba(255,255,255,0.25),
        inset 0 -10px 40px rgba(0,0,0,0.6);
      border: 6px solid rgba(244, 63, 94, 0.25);
    }

    /* Ambient Outer Glow */
    .icon-container::before {
      content: '';
      position: absolute;
      inset: -20px;
      border-radius: 240px;
      background: radial-gradient(circle at 50% 50%, rgba(244, 63, 94, 0.3), transparent 70%);
      z-index: -1;
    }

    .svg-wrapper {
      width: 720px;
      height: 720px;
      filter: drop-shadow(0 20px 40px rgba(0,0,0,0.6));
    }
  </style>
</head>
<body>
  <div class="icon-container">
    <div class="svg-wrapper">
      <svg viewBox="0 0 500 500" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- Multi-stop Gradient for 3D Neon Ribbon -->
          <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ff2a6d" />
            <stop offset="30%" stop-color="#ff6584" />
            <stop offset="60%" stop-color="#ffb86c" />
            <stop offset="85%" stop-color="#f43f5e" />
            <stop offset="100%" stop-color="#9f1239" />
          </linearGradient>

          <!-- Glowing Backlight -->
          <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="12" result="blur1" />
            <feGaussianBlur stdDeviation="28" result="blur2" />
            <feMerge>
              <feMergeNode in="blur2" />
              <feMergeNode in="blur1" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>

          <!-- Core Intersection Flare -->
          <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="30%" stop-color="#ffe4e6" />
            <stop offset="70%" stop-color="#fb7185" stop-opacity="0.8" />
            <stop offset="100%" stop-color="#f43f5e" stop-opacity="0" />
          </radialGradient>
        </defs>

        <!-- Background Ambient Reflection -->
        <ellipse cx="250" cy="250" rx="180" ry="120" fill="url(#starGlow)" opacity="0.35" />

        <!-- 3D Intertwined Infinity Heart Ribbon -->
        <path 
          d="M 250,250 
             C 170,120 70,150 70,250 
             C 70,350 170,380 250,250 
             C 330,120 430,150 430,250 
             C 430,350 330,380 250,250 Z" 
          fill="none" 
          stroke="url(#ribbonGrad)" 
          stroke-width="36" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#neonGlow)"
        />

        <!-- Secondary Inner Highlight Overlay -->
        <path 
          d="M 250,250 
             C 170,120 70,150 70,250 
             C 70,350 170,380 250,250 
             C 330,120 430,150 430,250 
             C 430,350 330,380 250,250 Z" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="6" 
          stroke-linecap="round" 
          opacity="0.6"
        />

        <!-- Center Intersection Radiant Diamond Sparkle -->
        <circle cx="250" cy="250" r="32" fill="url(#starGlow)" />
        <circle cx="250" cy="250" r="14" fill="#ffffff" />
        
        <!-- Starlight Rays -->
        <path d="M 250,210 L 250,290 M 210,250 L 290,250" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
        <path d="M 225,225 L 275,275 M 225,275 L 275,225" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8" />
      </svg>
    </div>
  </div>
</body>
</html>
